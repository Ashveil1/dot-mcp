[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dot-mcp"
version = "0.1.1"
description = "Personal MCP agent: shell, files, memory, goals, inbox, scheduler, capability URL + self-hosted OAuth"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ashveil1" }]
keywords = ["mcp", "agent", "cli", "termux", "personal-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "mcp>=1,<3",
    "uvicorn>=0.30",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]
vault = ["cryptography>=44,<47"]
browser = ["playwright>=1.50,<2", "websockets>=13,<17"]

[project.urls]
Homepage = "https://github.com/Ashveil1/dot-mcp"
Repository = "https://github.com/Ashveil1/dot-mcp"
Issues = "https://github.com/Ashveil1/dot-mcp/issues"

[project.scripts]
dot-mcp = "dot_mcp.cli:main"
dots = "dot_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dot_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/dot_mcp",
    "README.md",
    "LICENSE",
    "requirements.txt",
    "setup.sh",
    "run.sh",
    "test.sh",
    "expose.sh",
    "dots",
    "tests",
]

name: Publish to PyPI

# Release flow: bump version in pyproject.toml + CHANGELOG.md, push,
# then GitHub → Releases → "Draft a new release" → tag vX.Y.Z → Publish.
# Trusted publishing (OIDC) needs a pending publisher registered at:
#   https://pypi.org/manage/account/publishing/
# with: project=dot-mcp, owner=Ashveil1, repo=dot-mcp,
#       workflow=publish.yml  (no environment).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # required for PyPI trusted publishing (OIDC)

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

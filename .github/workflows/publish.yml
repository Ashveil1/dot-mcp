name: Publish to PyPI

# Two publishing paths, both guarded:
#   1. Merge to main that changes pyproject.toml (the release PR merge = approval)
#   2. Publishing a GitHub Release manually
# The publish step is skipped when the pyproject version already exists on
# PyPI, so reruns, releases after a merge, and non-release merges are safe.
# No API tokens are stored in this repo. PyPI trusted publishing (OIDC) must
# be configured on the PyPI project first:
#   PyPI project dot-mcp -> Publishing -> add GitHub publisher
#   owner: Ashveil1   repository: dot-mcp   workflow: publish.yml
#   environment: (leave empty unless you create a matching GitHub environment)

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # required for PyPI trusted publishing (OIDC)

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before publishing
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest tests/ -q
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check whether this version is already on PyPI
        id: pypi
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/dot-mcp/$VERSION/json")
          echo "http_status=$CODE" >> "$GITHUB_OUTPUT"
          echo "exists=$([ "$CODE" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publish to PyPI
        if: steps.pypi.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

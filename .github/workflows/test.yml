name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
        mcp: ["mcp>=1,<2", "mcp>=2,<3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and selected MCP SDK
        run: python -m pip install -e '.[dev]' '${{ matrix.mcp }}'
      - name: Run tests
        run: python -m pytest tests/ -q
